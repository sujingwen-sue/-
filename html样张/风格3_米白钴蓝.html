<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0"><title>竞聘陈述 · 米白钴蓝</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=Noto+Sans+SC:wght@400;600;700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.cn/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=Noto+Sans+SC:wght@400;600;700&display=swap">
<style>
/* === THEME + BASE === */
:root{--stage-bg:#e8e4cc;--ease:cubic-bezier(.16,1,.3,1)}
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

.deck-controls button{font:500 13px/1 sans-serif;padding:8px 14px;border-radius:20px;border:1px solid rgba(128,128,128,.4);
background:rgba(255,255,255,.85);color:#333;cursor:pointer;opacity:.35;transition:opacity .2s}.deck-controls button:hover{opacity:1}
*{margin:0;padding:0;box-sizing:border-box}
.r{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.slide.visible .r{opacity:1;transform:none}

/* === STYLE-SPECIFIC === */

:root{--slide-bg:#FDFAE7;--blue:#1E2BFA;--ink:#111;--muted:#6B6B6B}
.slide{background:radial-gradient(ellipse at 88% 8%,rgba(30,43,250,.08),transparent 45%),#FDFAE7;color:var(--ink);font-family:'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif}
.pill{display:inline-block;padding:12px 26px;border-radius:100px;border:1.5px solid rgba(30,43,250,.25);color:var(--blue);font:600 22px/1 'Space Grotesk','Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:1px}
.head{position:absolute;left:120px;top:110px;right:120px;display:flex;justify-content:space-between;align-items:center}
.brand{font:500 20px/1 'Space Grotesk','Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;color:var(--muted)}
h1{position:absolute;left:120px;top:260px;font:700 116px/1.18 'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:2px}
h1 span{color:var(--blue)}
.sub{position:absolute;left:124px;top:560px;font:400 32px/1.6 'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;color:var(--muted)} .sub b{color:var(--ink);font-weight:600;margin-right:20px}
.bar{position:absolute;left:124px;top:520px;height:6px;border-radius:6px;background:var(--blue);width:0;transition:width 1.1s var(--ease) .55s}
.visible .bar{width:160px}
.cards{position:absolute;left:120px;right:120px;bottom:110px;display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.card{background:rgba(30,43,250,.04);border:1.5px solid rgba(30,43,250,.2);border-radius:14px;padding:30px 30px 34px;transition:transform .3s,background .3s,opacity .8s var(--ease)}
.card:hover{background:rgba(30,43,250,.09);transform:translateY(-6px)}
.card i{font:700 22px/1 'Space Grotesk';font-style:normal;color:var(--blue)}
.card h3{font:700 36px/1.2 'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;margin:22px 0 10px}
.card p{font:400 21px/1.5 'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;color:var(--muted)}
</style></head><body>
<div class="deck-viewport"><main class="deck-stage" id="deckStage">
<section class="slide active"><div class="head r" style="transition-delay:0.10s"><span class="pill">竞聘陈述 · 2026</span><span class="brand">浙江华东工程建设管理有限公司 ｜ 智慧建造研究院</span></div>
<h1 class="r" style="transition-delay:0.37s">智慧建造研究院<br><span>副总经理</span></h1><div class="bar"></div>
<div class="sub r" style="transition-delay:0.64s"><b>苏竞雯</b>懂开发技术 · 懂产品设计 · 懂团队管理 · 懂 AI · 英语好</div>
<div class="cards"><div class="card r" style="transition-delay:0.80s"><i>01 ——</i><h3>个人简介</h3><p>教育背景与六年数字化经历</p></div><div class="card r" style="transition-delay:0.92s"><i>02 ——</i><h3>工作成绩</h3><p>四项代表性工作与亮点</p></div><div class="card r" style="transition-delay:1.04s"><i>03 ——</i><h3>岗位认知</h3><p>岗位职责与竞争优势</p></div><div class="card r" style="transition-delay:1.16s"><i>04 ——</i><h3>履职思路</h3><p>四项职责对应四项举措</p></div></div></section>
</main></div>
<div class="deck-controls"><button id="replay" title="重播动画 (R)">↻ 重播动画</button></div>
<script>
/* === SLIDE PRESENTATION CONTROLLER === */
class SlidePresentation{
 constructor(){this.slides=document.querySelectorAll('.slide');this.i=0;this.stage=document.getElementById('deckStage');
  this.scale();addEventListener('resize',()=>this.scale());
  addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key))this.go(this.i+1);
   if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key))this.go(this.i-1);if(e.key==='r'||e.key==='R')this.replay();});
  let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX);
  addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)this.go(this.i+(d<0?1:-1));x0=null;});
  document.getElementById('replay').addEventListener('click',()=>this.replay());
  requestAnimationFrame(()=>this.go(0));}
 scale(){const f=Math.min(innerWidth/1920,innerHeight/1080);this.stage.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`;}
 go(n){this.i=Math.max(0,Math.min(n,this.slides.length-1));this.slides.forEach((s,k)=>{s.classList.toggle('active',k===this.i);s.classList.toggle('visible',k===this.i);});}
 replay(){const s=this.slides[this.i];s.classList.remove('visible');void s.offsetWidth;s.classList.add('visible');}
}
new SlidePresentation();
</script></body></html>
