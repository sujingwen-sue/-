<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500&family=IBM+Plex+Mono&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.cn/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500&family=IBM+Plex+Mono&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* === THEME + BASE === */
:root{--stage-bg:#0f1528;--ease:cubic-bezier(.16,1,.3,1)}
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

.deck-controls button{font:500 13px/1 sans-serif;padding:8px 14px;border-radius:20px;border:1px solid rgba(128,128,128,.4);
background:rgba(255,255,255,.85);color:#333;cursor:pointer;opacity:.35;transition:opacity .2s}.deck-controls button:hover{opacity:1}
*{margin:0;padding:0;box-sizing:border-box}
.r{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.slide.visible .r{opacity:1;transform:none}

/* === STYLE-SPECIFIC === */

:root{--slide-bg:#1C2644;--gold:#C8A870;--cream:#F0ECE3;--muted:#8A96A8;--line:rgba(200,168,112,.28)}
.slide{background:#1C2644;color:#E2DCD0;font-family:'DM Sans','Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
 background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:80px 80px}
.mono{font-family:'IBM Plex Mono',monospace;letter-spacing:3px;font-size:18px;color:var(--muted)}
.top{position:absolute;left:120px;right:120px;top:80px;display:flex;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid var(--line)}
.hl{position:absolute;left:120px;top:230px;width:1150px}
.hl .k{font:400 26px/1 'Noto Serif SC','Songti SC','SimSun','Noto Serif CJK SC',serif;color:var(--gold);letter-spacing:6px}
h1{font:700 104px/1.25 'Noto Serif SC','Songti SC','SimSun','Noto Serif CJK SC',serif;color:var(--cream);margin-top:40px;letter-spacing:4px}
h1 em{font-style:normal;color:var(--gold)}
.goldrule{height:1px;background:var(--gold);width:0;margin:52px 0 36px;transition:width 1.4s var(--ease) .6s}
.visible .goldrule{width:520px}
.who{font:400 34px/1.6 'Noto Serif SC','Songti SC','SimSun','Noto Serif CJK SC',serif;color:var(--cream)} .who small{display:block;font:400 22px/1.6 'DM Sans','Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;color:var(--muted);margin-top:6px}
.toc{position:absolute;right:120px;top:250px;width:440px;border-left:1px solid var(--line);padding-left:56px}
.toc div{padding:26px 0;border-bottom:1px solid var(--line)}
.toc div:last-child{border:0}
.toc i{font:400 46px/1 'Source Serif 4',serif;font-style:italic;color:var(--gold);margin-right:22px;vertical-align:-4px}
.toc b{font:600 32px/1 'Noto Serif SC','Songti SC','SimSun','Noto Serif CJK SC',serif;color:var(--cream)}
.toc p{font:400 19px/1.5 'DM Sans','Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;color:var(--muted);margin:12px 0 0 74px}
.foot{position:absolute;left:120px;right:120px;bottom:70px;display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:22px}
</style></head><body>
<div class="deck-viewport"><main class="deck-stage" id="deckStage">
<section class="slide active"><div class="top r" style="transition-delay:0.10s"><span class="mono">ZHEJIANG HUADONG CONSTRUCTION MANAGEMENT</span><span class="mono">MMXXVI</span></div>

</main></div>
<div class="deck-controls"><button id="replay" title="重播动画 (R)">↻ 重播动画</button></div>
<script>
/* === SLIDE PRESENTATION CONTROLLER === */
class SlidePresentation{
 constructor(){this.slides=document.querySelectorAll('.slide');this.i=0;this.stage=document.getElementById('deckStage');
  this.scale();addEventListener('resize',()=>this.scale());
  addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key))this.go(this.i+1);
   if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key))this.go(this.i-1);if(e.key==='r'||e.key==='R')this.replay();});
  let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX);
  addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)this.go(this.i+(d<0?1:-1));x0=null;});
  document.getElementById('replay').addEventListener('click',()=>this.replay());
  requestAnimationFrame(()=>this.go(0));}
 scale(){const f=Math.min(innerWidth/1920,innerHeight/1080);this.stage.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`;}
 go(n){this.i=Math.max(0,Math.min(n,this.slides.length-1));this.slides.forEach((s,k)=>{s.classList.toggle('active',k===this.i);s.classList.toggle('visible',k===this.i);});}
 replay(){const s=this.slides[this.i];s.classList.remove('visible');void s.offsetWidth;s.classList.add('visible');}
}
new SlidePresentation();
</script></body></html>
