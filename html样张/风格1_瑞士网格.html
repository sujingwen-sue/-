<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0"><title>竞聘陈述 · 瑞士网格</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Noto+Sans+SC:wght@400;500;700;800;900&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.cn/css2?family=Archivo:wght@800;900&family=Noto+Sans+SC:wght@400;500;700;800;900&display=swap">
<style>
/* === THEME + BASE === */
:root{--stage-bg:#e9e9e9;--ease:cubic-bezier(.16,1,.3,1)}
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

.deck-controls button{font:500 13px/1 sans-serif;padding:8px 14px;border-radius:20px;border:1px solid rgba(128,128,128,.4);
background:rgba(255,255,255,.85);color:#333;cursor:pointer;opacity:.35;transition:opacity .2s}.deck-controls button:hover{opacity:1}
*{margin:0;padding:0;box-sizing:border-box}
.r{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.slide.visible .r{opacity:1;transform:none}

/* === STYLE-SPECIFIC === */

:root{--slide-bg:#fff;--red:#D7000F;--ink:#111}
.slide{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;color:var(--ink);
 background-image:linear-gradient(rgba(0,0,0,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.045) 1px,transparent 1px);background-size:120px 120px;background-position:-1px -1px}
.redblock{position:absolute;left:0;top:0;width:600px;height:1080px;background:var(--red);transform-origin:top;transform:scaleY(0);transition:transform 1s var(--ease)}
.visible .redblock{transform:scaleY(1)}
.bignum{position:absolute;left:72px;bottom:60px;font:900 360px/0.8 'Archivo',sans-serif;color:#fff;letter-spacing:-12px}
.side{position:absolute;left:80px;top:80px;color:#fff;font:500 22px/1.6 'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif}
.side b{display:block;font:800 18px/1 'Archivo';letter-spacing:4px;margin-bottom:14px;opacity:.8}
.main{position:absolute;left:720px;top:150px;right:120px}
.kick{font:700 26px/1 'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;color:var(--red);letter-spacing:2px}
h1{font:900 112px/1.12 'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;margin:34px 0 0;letter-spacing:2px}
.rule{height:8px;background:var(--ink);width:0;margin:46px 0 30px;transition:width 1s var(--ease) .5s}
.visible .rule{width:240px}
.who{font:500 34px/1.5 'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif} .who span{color:#777;margin-left:24px;font-size:28px}
.agenda{position:absolute;left:720px;right:120px;bottom:96px;display:grid;grid-template-columns:repeat(4,1fr);border-top:3px solid var(--ink)}
.agenda div{padding:26px 24px 0 0}
.agenda i{font:800 44px/1 'Archivo';font-style:normal;color:var(--red)}
.agenda h3{font:800 32px/1.3 'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;margin:14px 0 8px}
.agenda p{font:400 20px/1.5 'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;color:#666}
</style></head><body>
<div class="deck-viewport"><main class="deck-stage" id="deckStage">
<section class="slide active"><div class="redblock"></div>
<div class="side r" style="transition-delay:0.60s"><b>2026 · COMPETITIVE INTERVIEW</b>浙江华东工程建设管理有限公司<br>智慧建造研究院</div>
<div class="bignum r" style="transition-delay:0.72s">26</div>
<div class="main"><div class="kick r" style="transition-delay:0.30s">竞聘陈述</div>
<h1 class="r" style="transition-delay:0.42s">智慧建造研究院<br>副总经理</h1><div class="rule"></div>
<div class="who r" style="transition-delay:0.74s">苏竞雯<span>懂开发 · 懂产品 · 懂管理 · 懂 AI</span></div></div>
<div class="agenda"><div class="r" style="transition-delay:0.90s"><i>01</i><h3>个人简介</h3><p>教育背景与六年数字化经历</p></div><div class="r" style="transition-delay:1.02s"><i>02</i><h3>工作成绩</h3><p>四项代表性工作与亮点</p></div><div class="r" style="transition-delay:1.14s"><i>03</i><h3>岗位认知</h3><p>岗位职责与竞争优势</p></div><div class="r" style="transition-delay:1.26s"><i>04</i><h3>履职思路</h3><p>四项职责对应四项举措</p></div></div></section>
</main></div>
<div class="deck-controls"><button id="replay" title="重播动画 (R)">↻ 重播动画</button></div>
<script>
/* === SLIDE PRESENTATION CONTROLLER === */
class SlidePresentation{
 constructor(){this.slides=document.querySelectorAll('.slide');this.i=0;this.stage=document.getElementById('deckStage');
  this.scale();addEventListener('resize',()=>this.scale());
  addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key))this.go(this.i+1);
   if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key))this.go(this.i-1);if(e.key==='r'||e.key==='R')this.replay();});
  let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX);
  addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)this.go(this.i+(d<0?1:-1));x0=null;});
  document.getElementById('replay').addEventListener('click',()=>this.replay());
  requestAnimationFrame(()=>this.go(0));}
 scale(){const f=Math.min(innerWidth/1920,innerHeight/1080);this.stage.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`;}
 go(n){this.i=Math.max(0,Math.min(n,this.slides.length-1));this.slides.forEach((s,k)=>{s.classList.toggle('active',k===this.i);s.classList.toggle('visible',k===this.i);});}
 replay(){const s=this.slides[this.i];s.classList.remove('visible');void s.offsetWidth;s.classList.add('visible');}
}
new SlidePresentation();
</script></body></html>
