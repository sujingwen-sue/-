<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700;800&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.cn/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700;800&display=swap">
<style>
/* === THEME + BASE === */
:root{--stage-bg:#061a2d;--ease:cubic-bezier(.16,1,.3,1)}
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

.deck-controls button{font:500 13px/1 sans-serif;padding:8px 14px;border-radius:20px;border:1px solid rgba(128,128,128,.4);
background:rgba(255,255,255,.85);color:#333;cursor:pointer;opacity:.35;transition:opacity .2s}.deck-controls button:hover{opacity:1}
*{margin:0;padding:0;box-sizing:border-box}
.r{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.slide.visible .r{opacity:1;transform:none}

/* === STYLE-SPECIFIC === */

:root{--slide-bg:#0A2742;--cy:#5CE1E6;--ink:#EAF4FA;--dim:#7FA3BF}
.slide{background:radial-gradient(ellipse at 75% 40%,#123A5E 0%,#0A2742 60%);color:var(--ink);font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
 background-image:linear-gradient(rgba(92,225,230,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(92,225,230,.07) 1px,transparent 1px),
 linear-gradient(rgba(92,225,230,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(92,225,230,.035) 1px,transparent 1px);
 background-size:160px 160px,160px 160px,32px 32px,32px 32px}
.mono{font-family:'JetBrains Mono',monospace;color:var(--dim);font-size:17px;letter-spacing:2px}
.frame{position:absolute;inset:48px;border:1px solid rgba(92,225,230,.35)}
.tb{position:absolute;right:48px;bottom:48px;width:620px;border-left:1px solid rgba(92,225,230,.35);border-top:1px solid rgba(92,225,230,.35);display:grid;grid-template-columns:1fr 1fr}
.tb div{padding:16px 22px;border-right:1px solid rgba(92,225,230,.2);border-bottom:1px solid rgba(92,225,230,.2)}
.tb b{display:block;font:500 24px/1.3 'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;color:var(--ink);margin-top:6px}
.k{position:absolute;left:130px;top:130px;color:var(--cy)}
h1{position:absolute;left:126px;top:200px;font:800 108px/1.2 'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:3px}
h1 span{color:var(--cy)}
.who{position:absolute;left:130px;top:490px;font:500 34px/1.5 'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif} .who em{font-style:normal;color:var(--dim);font-size:24px;margin-left:22px}
svg.dam{position:absolute;right:110px;top:150px;width:660px;height:420px;overflow:visible}
.dam path,.dam line,.dam circle{fill:none;stroke:var(--cy);stroke-width:2;stroke-dasharray:1600;stroke-dashoffset:1600;transition:stroke-dashoffset 2.4s var(--ease)}
.dam .thin{stroke-width:1;opacity:.5} .visible .dam path,.visible .dam line,.visible .dam circle{stroke-dashoffset:0}
.dam text{font:15px 'JetBrains Mono',monospace;fill:var(--dim);opacity:0;transition:opacity .6s 1.8s} .visible .dam text{opacity:1}
.node{fill:var(--cy)!important;stroke:none!important;animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.steps{position:absolute;left:130px;top:640px;width:1080px;display:grid;grid-template-columns:repeat(4,1fr)}
.steps div{border-top:2px solid var(--cy);padding:22px 20px 0 0;position:relative}
.steps div::before{content:'';position:absolute;top:-8px;left:0;width:14px;height:14px;background:#0A2742;border:2px solid var(--cy);transform:rotate(45deg)}
.steps i{font:500 18px/1 'JetBrains Mono';font-style:normal;color:var(--cy)}
.steps h3{font:700 34px/1.3 'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;margin:14px 0 8px}
.steps p{font:400 20px/1.5 'Noto Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;color:var(--dim)}
</style></head><body>

<script>
/* === SLIDE PRESENTATION CONTROLLER === */
class SlidePresentation{
 constructor(){this.slides=document.querySelectorAll('.slide');this.i=0;this.stage=document.getElementById('deckStage');
  this.scale();addEventListener('resize',()=>this.scale());
  addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key))this.go(this.i+1);
   if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key))this.go(this.i-1);if(e.key==='r'||e.key==='R')this.replay();});
  let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX);
  addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)this.go(this.i+(d<0?1:-1));x0=null;});
  document.getElementById('replay').addEventListener('click',()=>this.replay());
  requestAnimationFrame(()=>this.go(0));}
 scale(){const f=Math.min(innerWidth/1920,innerHeight/1080);this.stage.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`;}
 go(n){this.i=Math.max(0,Math.min(n,this.slides.length-1));this.slides.forEach((s,k)=>{s.classList.toggle('active',k===this.i);s.classList.toggle('visible',k===this.i);});}
 replay(){const s=this.slides[this.i];s.classList.remove('visible');void s.offsetWidth;s.classList.add('visible');}
}
new SlidePresentation();
</script></body></html>
